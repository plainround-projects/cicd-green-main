<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">A pipeline that keeps main green</title>
<desc id="d">A pull request, a push to a branch, starts the workflow, and the job changes decides whether the change is code or documentation only. For code, four jobs start together. Inside the required check on main are Lint, Unit tests, Build and the Integration test, which waits for Build. Build makes one wheel with a checksum, the Artifact, and Integration verifies it. Only when all four required jobs are green does the required check let a change merge into main. Quarantine runs outside the check, never blocks, and reports a flaky test to the flaky-test detection, which reads the run log runs.csv together with the local runner. A warning note names make flaky-hunt.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">A pipeline that keeps main green</text>
<text class="caption" x="48" y="100">Four jobs gate main; a fifth, the quarantine, runs outside the gate and never blocks. Amber: the flaky test.</text>
<rect class="actor" x="48" y="184" width="168" height="72" rx="36"/>
<text class="name" x="132" y="216" text-anchor="middle">Pull request</text>
<text class="sub" x="132" y="238" text-anchor="middle">a push</text>
<rect class="svc" x="48" y="330" width="200" height="96" rx="12"/>
<text class="name" x="64" y="362">changes</text>
<text class="sub" x="64" y="386">pipeline/changes.sh</text>
<text class="sub" x="64" y="408">docs only: skipped</text>
<rect class="zone" x="352" y="132" width="280" height="492" rx="14"/>
<text class="tag b t-accent" x="368" y="160">Required check on main</text>
<rect class="svc" x="376" y="184" width="232" height="80" rx="12"/>
<text class="name" x="392" y="216">Lint</text>
<text class="sub" x="392" y="240">format, ruff, mypy</text>
<rect class="svc" x="376" y="288" width="232" height="80" rx="12"/>
<text class="name" x="392" y="320">Unit tests</text>
<text class="sub" x="392" y="344">coverage floors</text>
<rect class="svc" x="376" y="392" width="232" height="80" rx="12"/>
<text class="name" x="392" y="424">Build</text>
<text class="sub" x="392" y="448">one wheel, SHA256SUMS</text>
<rect class="svc" x="376" y="512" width="232" height="80" rx="12"/>
<text class="name" x="392" y="544">Integration test</text>
<text class="sub" x="392" y="568">verify, install wheel</text>
<path class="store" d="M780 196a120 12 0 0 1 240 0v76a120 12 0 0 1 -240 0z"/>
<path class="rim" d="M780 196a120 12 0 0 0 240 0"/>
<text class="name" x="900" y="228" text-anchor="middle">main</text>
<text class="sub" x="900" y="250" text-anchor="middle">stays releasable</text>
<path class="store" d="M700 404a100 12 0 0 1 200 0v98a100 12 0 0 1 -200 0z"/>
<path class="rim" d="M700 404a100 12 0 0 0 200 0"/>
<text class="name" x="800" y="436" text-anchor="middle">Artifact</text>
<text class="sub" x="800" y="458" text-anchor="middle">0.1.0+commit</text>
<text class="sub" x="800" y="480" text-anchor="middle">dist/SHA256SUMS</text>
<rect class="note" x="680" y="520" width="280" height="120" rx="10"/>
<text class="label b t-warn" x="696" y="550">make flaky-hunt</text>
<text class="sub" x="696" y="576">40 runs on one commit,</text>
<text class="sub" x="696" y="598">3 failed: quarantined,</text>
<text class="sub" x="696" y="620">not rerun until green</text>
<rect class="svc" x="376" y="660" width="232" height="80" rx="12"/>
<text class="name" x="392" y="692">quarantine</text>
<text class="sub" x="392" y="716">non-blocking job</text>
<rect class="svc" x="700" y="660" width="250" height="96" rx="12"/>
<text class="name" x="716" y="692">Flaky detection</text>
<text class="sub" x="716" y="716">both results, one commit</text>
<text class="sub" x="716" y="738">from the run log</text>
<path class="store" d="M980 652a86 12 0 0 1 172 0v76a86 12 0 0 1 -172 0z"/>
<path class="rim" d="M980 652a86 12 0 0 0 172 0"/>
<text class="name" x="1066" y="684" text-anchor="middle">Run log</text>
<text class="sub" x="1066" y="706" text-anchor="middle">runs.csv</text>
<rect class="svc" x="976" y="500" width="176" height="80" rx="12"/>
<text class="name" x="992" y="532">Local runner</text>
<text class="sub" x="992" y="556">make run</text>
<path class="sync" d="M132 256V330"/>
<text class="label t-accent" x="144" y="300">on push</text>
<path class="sync" d="M248 372H352"/>
<text class="label t-accent" x="262" y="362">code=true</text>
<path class="sync" d="M148 426V688Q148 700 160 700H376"/>
<text class="label t-accent" x="170" y="690">code=true</text>
<path class="sync" d="M496 472V512"/>
<text class="label t-accent" x="508" y="498">digest</text>
<path class="sync" d="M632 250H780"/>
<text class="label t-accent" x="644" y="240">merge</text>
<path class="sync" d="M608 432H700"/>
<text class="label t-accent" x="640" y="422">wheel</text>
<path class="fail" d="M608 700H700"/>
<text class="label t-warn" x="620" y="690">reports</text>
<path class="read" d="M980 706H950"/>
<path class="sync" d="M1064 580V640"/>
<text class="label t-accent" x="1076" y="614">writes</text>
<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
<path class="read" d="M520 786H584"/><text class="legend" x="596" y="791">read</text>
<path class="fail" d="M696 786H760"/><text class="legend" x="772" y="791">failure path</text>
</svg>
